<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 검색 트렌드 대시보드 (Live)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone CDN (JSX 변환용) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 아이콘 컴포넌트
        const FlameIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3.25a3.25 3.25 0 0 0 2.5 3.25z"></path>
            </svg>
        );

        const RefreshIcon = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 2v6h-6"></path>
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                <path d="M3 22v-6h6"></path>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
        );

        const ExternalLinkIcon = ({ size = 12, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
        );

        const GlobeIcon = ({ size = 22, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
        );

        const SearchIcon = ({ size = 22, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        );

        function App() {
            const [trends, setTrends] = useState({ google: [], naver: [] });
            const [loading, setLoading] = useState(true);
            const [lastUpdated, setLastUpdated] = useState('');
            const [error, setError] = useState(null);

            // 다중 CORS 프록시를 활용한 고안정성 fetch 함수
            const fetchWithMultiProxy = async (targetUrl) => {
                const proxies = [
                    (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                    (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
                ];

                for (const getProxyUrl of proxies) {
                    try {
                        const response = await fetch(getProxyUrl(targetUrl));
                        if (response.ok) {
                            const text = await response.text();
                            if (text && text.trim().length > 0) {
                                return text;
                            }
                        }
                    } catch (e) {
                        console.warn('프록시 시도 실패, 다음 프록시로 전환:', e);
                    }
                }
                throw new Error('모든 실시간 데이터 채널 연결에 실패했습니다.');
            };

            const fetchAllTrends = async () => {
                setLoading(true);
                setError(null);
                try {
                    // 1. Google 트렌드 RSS 수집
                    const googleRssUrl = 'https://trends.google.co.kr/trends/trendingsearches/daily/rss?geo=KR';
                    const googleXmlText = await fetchWithMultiProxy(googleRssUrl);
                    
                    const parser = new DOMParser();
                    const googleDoc = parser.parseFromString(googleXmlText, 'text/xml');
                    const googleItems = googleDoc.querySelectorAll('item');
                    
                    let googleData = [];
                    googleItems.forEach((item, index) => {
                        if (index < 10) {
                            const title = item.querySelector('title')?.textContent || '트렌드 키워드';
                            const traffic = item.getElementsByTagName('ht:approx_traffic')[0]?.textContent || '급상승';
                            const link = item.querySelector('link')?.textContent || 'https://trends.google.co.kr';
                            googleData.push({ rank: index + 1, title, traffic, link });
                        }
                    });

                    // 2. 국내 주요 실시간 뉴스/이슈 트렌드 수집 (Google News KR RSS 활용으로 안정적 실시간 연동)
                    const newsRssUrl = 'https://news.google.com/rss?hl=ko&gl=KR&ceid=KR:ko';
                    const newsXmlText = await fetchWithMultiProxy(newsRssUrl);
                    
                    const newsDoc = parser.parseFromString(newsXmlText, 'text/xml');
                    const newsItems = newsDoc.querySelectorAll('item');
                    
                    let naverData = [];
                    newsItems.forEach((item, index) => {
                        if (index < 10) {
                            const title = item.querySelector('title')?.textContent || '실시간 이슈';
                            const link = item.querySelector('link')?.textContent || 'https://www.naver.com';
                            naverData.push({ rank: index + 1, title, link });
                        }
                    });

                    if (googleData.length === 0 || naverData.length === 0) {
                        throw new Error('수신된 데이터 항목이 비어 있습니다.');
                    }

                    setTrends({ google: googleData, naver: naverData });
                    setLastUpdated(new Date().toLocaleTimeString());
                } catch (err) {
                    console.error('데이터 수집 에러:', err);
                    setError('실시간 데이터 채널을 불러오는 중 네트워크 지연이 발생했습니다. 새로고침을 다시 시도해주세요.');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchAllTrends();
                // 10분(600,000ms) 주기 자동 갱신
                const interval = setInterval(fetchAllTrends, 600000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                    {/* Header */}
                    <header className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl">
                        <div className="flex items-center gap-3 mb-4 md:mb-0">
                            <div className="p-3 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                                <FlameIcon size={28} />
                            </div>
                            <div>
                                <div className="flex items-center gap-2">
                                    <h1 className="text-2xl font-bold tracking-tight">실시간 검색 트렌드 대시보드</h1>
                                    <span className="text-[10px] px-2.5 py-0.5 rounded-full font-semibold uppercase tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                                        ● LIVE STABLE
                                    </span>
                                </div>
                                <p className="text-slate-400 text-sm mt-0.5">글로벌 및 국내 실시간 인기 트렌드 Top 10 라이브 모니터링</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            {lastUpdated && (
                                <span className="text-xs text-slate-400 bg-slate-900 px-3 py-2 rounded-xl border border-slate-700">
                                    갱신 시각: {lastUpdated}
                                </span>
                            )}
                            <button
                                onClick={fetchAllTrends}
                                disabled={loading}
                                className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all text-white px-4 py-2.5 rounded-xl font-medium shadow-md disabled:opacity-50 cursor-pointer"
                            >
                                <RefreshIcon size={16} className={loading ? 'animate-spin' : ''} />
                                <span>새로고침</span>
                            </button>
                        </div>
                    </header>

                    {/* Error Banner */}
                    {error && (
                        <div className="max-w-6xl mx-auto mb-6 bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl text-center text-sm">
                            {error}
                        </div>
                    )}

                    {/* Main Content Grid */}
                    <main className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
                        {/* Google Trends Card */}
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col">
                            <div className="flex items-center gap-2.5 pb-4 mb-4 border-b border-slate-700">
                                <GlobeIcon className="text-blue-400" size={22} />
                                <h2 className="text-xl font-semibold text-blue-400">Google 실시간 트렌드</h2>
                            </div>
                            {loading && trends.google.length === 0 ? (
                                <div className="flex-1 flex items-center justify-center py-24 text-slate-400">
                                    <div className="flex items-center gap-2">
                                        <RefreshIcon size={20} className="animate-spin text-blue-400" />
                                        <span>구글 트렌드 수신 중...</span>
                                    </div>
                                </div>
                            ) : (
                                <ul className="space-y-3">
                                    {trends.google.map((item) => (
                                        <li key={item.rank} className="flex items-center justify-between p-3.5 bg-slate-900/50 hover:bg-slate-700/50 rounded-xl border border-slate-700/60 transition-colors">
                                            <div className="flex items-center gap-3 overflow-hidden">
                                                <span className={`w-6 h-6 flex items-center justify-center rounded-lg text-xs font-bold shrink-0 ${
                                                    item.rank <= 3 ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'
                                                }`}>
                                                    {item.rank}
                                                </span>
                                                <a
                                                    href={item.link}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-slate-200 hover:text-blue-400 truncate text-sm font-medium transition-colors flex items-center gap-1.5"
                                                >
                                                    <span className="truncate">{item.title}</span>
                                                    <ExternalLinkIcon size={12} className="text-slate-500 shrink-0" />
                                                </a>
                                            </div>
                                            <span className="text-xs text-slate-400 whitespace-nowrap ml-2 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 shrink-0">{item.traffic}</span>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>

                        {/* Domestic Trends Card */}
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col">
                            <div className="flex items-center gap-2.5 pb-4 mb-4 border-b border-slate-700">
                                <SearchIcon className="text-emerald-400" size={22} />
                                <h2 className="text-xl font-semibold text-emerald-400">국내 실시간 주요 이슈</h2>
                            </div>
                            {loading && trends.naver.length === 0 ? (
                                <div className="flex-1 flex items-center justify-center py-24 text-slate-400">
                                    <div className="flex items-center gap-2">
                                        <RefreshIcon size={20} className="animate-spin text-emerald-400" />
                                        <span>국내 트렌드 수신 중...</span>
                                    </div>
                                </div>
                            ) : (
                                <ul className="space-y-3">
                                    {trends.naver.map((item) => (
                                        <li key={item.rank} className="flex items-center justify-between p-3.5 bg-slate-900/50 hover:bg-slate-700/50 rounded-xl border border-slate-700/60 transition-colors">
                                            <div className="flex items-center gap-3 overflow-hidden">
                                                <span className={`w-6 h-6 flex items-center justify-center rounded-lg text-xs font-bold shrink-0 ${
                                                    item.rank <= 3 ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300'
                                                }`}>
                                                    {item.rank}
                                                </span>
                                                <a
                                                    href={item.link}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-slate-200 hover:text-emerald-400 truncate text-sm font-medium transition-colors flex items-center gap-1.5"
                                                >
                                                    <span className="truncate">{item.title}</span>
                                                    <ExternalLinkIcon size={12} className="text-slate-500 shrink-0" />
                                                </a>
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    </main>

                    {/* Footer Guide Note */}
                    <footer className="max-w-6xl mx-auto mt-8 text-center text-xs text-slate-500 border-t border-slate-800 pt-6">
                        다중 프록시 연동 및 주기적 실시간 동기화 아키텍처가 적용되어 있어 브라우저 환경에서도 라이브 데이터를 안정적으로 유지합니다.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
